services:
  db:
    image: postgres:16-alpine
    container_name: owl-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  legacy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: owl-pos-legacy
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pos}
      JWT_SECRET: ${JWT_SECRET}
      SAAS_ADMIN_EMAIL: ${SAAS_ADMIN_EMAIL:-admin@owltechsolutionsltd.com}
      SAAS_ADMIN_PASSWORD: ${SAAS_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-10.0.1.1}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-info@owltechsolutionsltd.com}
      RESET_FROM_EMAIL: ${RESET_FROM_EMAIL:-info@owltechsolutionsltd.com}
      REPORT_FROM_EMAIL: ${REPORT_FROM_EMAIL:-info@owltechsolutionsltd.com}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://pos.owltechsolutionsltd.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "3002"

  api:
    build:
      context: ./apps/api
    container_name: owl-pos-api
    restart: unless-stopped
    environment:
      PORT: 3001
      LEGACY_URL: http://legacy:3002
    depends_on:
      - legacy
    expose:
      - "3001"

  web:
    build:
      context: ./apps/web
    container_name: owl-pos-web
    restart: unless-stopped
    volumes:
      - /www/wwwroot/pos.owltechsolutionsltd.com/brand-assets:/usr/share/nginx/html/brand:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pos_db:
