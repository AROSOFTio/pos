name: Import POS source
on:
  push:
    branches: [main]
    paths: [source.zip]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack source
        run: |
          test -f source.zip
          unzip -o source.zip -d .
          rm source.zip
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import and structure universal POS source"
          git push
